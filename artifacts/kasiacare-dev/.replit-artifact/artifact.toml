kind = "web"
previewPath = "/dev/"
title = "KasiaCare Dev"
version = "1.0.0"
id = "artifacts/kasiacare-dev"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/dev/" ]
localPort = 24844

[services.development]
run = "pnpm --filter @workspace/kasiacare-dev run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kasiacare-dev", "run", "build" ]
publicDir = "artifacts/kasiacare-dev/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24844"
BASE_PATH = "/dev/"
